{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-card"><span class="eyebrow">Детский центр</span><h1>{{ title }}</h1>
<form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Сохранить</button>
    <a class="button button-light" href="javascript:history.back()">Назад</a>
</form></div>
{% endblock %}
